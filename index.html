<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>dswap</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        overflow-x: hidden;
        background: #0f1419;
      }
      #app {
        width: 100%;
        min-height: 100vh;
      }
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        color: #fff;
        font-family: 'Outfit', sans-serif;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Detect if page is blank/failed to load and force reload
      window.addEventListener('load', () => {
        setTimeout(() => {
          const appElement = document.getElementById('app');
          if (!appElement || !appElement.innerHTML || appElement.innerHTML.trim() === '' || appElement.innerHTML.includes('Loading...')) {
            console.warn('App failed to initialize, reloading...');
            window.location.reload();
          }
        }, 3000);
      });

      // Clear old service worker cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => {
            registration.unregister().catch(() => {});
          });
        }).catch(() => {});
      }

      // Handle network changes
      window.addEventListener('online', () => {
        console.log('Back online');
        if (document.getElementById('app').innerHTML.trim() === '') {
          window.location.reload();
        }
      });
    </script>
  </head>
  <body>
    <div id="app">
      <div class="loading-container">
        <div class="spinner"></div>
        <span>Loading dswap...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
